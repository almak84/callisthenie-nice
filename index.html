<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callisthénie à Nice Côte d'Azûr</title>
    <link rel="icon" type="image/png" href="cal1.png">
    <meta name="description" content="Rejoignez la communauté de Callisthénie à Nice. Entraînement au poids du corps, street workout et coaching. Prochainement dans le 06.">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo { width: 140px; height: auto; margin-bottom: 20px; }
        .status { font-size: 12px; letter-spacing: 3px; color: #888; text-transform: uppercase; margin-bottom: 20px; }
        .main-text { font-size: 18px; font-weight: 300; margin-bottom: 30px; color: #eee; }
        .contact-link { font-size: 14px; color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, 0.3); margin-bottom: 40px; transition: 0.3s; }
        .contact-link:hover { border-bottom: 1px solid #fff; }

        /* Bloc Concours */
        .event-box {
            border: 2px solid #ffd700;
            padding: 25px;
            background: #000;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .event-title { color: #ffd700; font-family: 'Arial Black', sans-serif; font-size: 1.4rem; margin: 0 0 10px 0; text-transform: uppercase; }
        .event-spots { font-size: 0.8rem; font-weight: bold; margin-bottom: 20px; letter-spacing: 1px; color: #fff; }
        .btn-open {
            display: block;
            background: #ffd700;
            color: #000;
            font-family: 'Arial Black', sans-serif;
            text-decoration: none;
            padding: 15px;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-open:hover { transform: scale(1.02); background: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <img src="cal1.png" alt="Logo" class="logo">
        <h1 class="status">www.callisthenienice.fr</h1>
        <p class="main-text">Le prochain Hub de la discipline à Nice. [restez connectés]</p>
        <a href="mailto:contact@callisthenienice.fr" class="contact-link">contact@callisthenienice.fr</a>

        <div class="event-box">
            <p style="font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 10px; color: #888;">PROCHAIN ÉVÉNEMENT</p>
            <h2 class="event-title">NICE CALISTHENICS OPEN 2026</h2>
            <p class="event-spots">VAUBAN • FORUM NICE NORD</p>
            <a href="/concours" class="btn-open">Découvrir / Inscriptions</a>
        </div>
    </div>
        <div id="music-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; align-items: center; background: rgba(0,0,0,0.8); border: 1px solid #ffd700; padding: 10px; border-radius: 50px;">
    
        <span id="music-status" style="color: #ffd700; font-size: 10px; font-family: 'Arial Black', sans-serif; margin-right: 10px; text-transform: uppercase; letter-spacing: 1px;">OFF</span>
    
        <button onclick="toggleMusic()" style="background: #ffd700; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; outline: none;">
            <span id="music-icon">▶</span>
        </button>

        <audio id="bgAudio" loop>
            <source src="bg-music.mp3" type="audio/mpeg">
            Ton navigateur ne supporte pas l'audio.
        </audio>
    </div>

    <script>
        var audio = document.getElementById("bgAudio");
        var statusText = document.getElementById("music-status");
        var icon = document.getElementById("music-icon");

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                statusText.innerText = "ON";
                icon.innerText = "II"; // Symbole Pause
                statusText.style.color = "#fff";
            } else {
                audio.pause();
                statusText.innerText = "OFF";
                icon.innerText = "▶"; // Symbole Play
                statusText.style.color = "#ffd700";
            }
        }
    </script>
</body>
</html>
