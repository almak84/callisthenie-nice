<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calisthénie Nice</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .content {
            padding: 20px;
        }

        .status {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 20px;
            display: block;
        }

        .main-text {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 40px;
            color: #eee;
        }

        .contact-link {
            font-size: 14px;
            color: #fff;
            text-decoration: none;
            padding-bottom: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: border-color 0.3s ease;
        }

        .contact-link:hover {
            border-bottom: 1px solid #fff;
        }
    </style>
</head>
<body>
    <div class="content">
        <span class="status">Calisthénie Nice</span>
        <p class="main-text">Prochainement à Nice. Restez connectés.</p>
        <a href="mailto:contact@calisthenienice.fr" class="contact-link">
            contact@calisthenienice.fr
        </a>
    </div>
</body>
</html>
